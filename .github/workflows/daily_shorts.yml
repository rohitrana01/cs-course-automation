name: Daily 2 Shorts Generator (Morning & Evening)

on:
  schedule:
    # 03:00 UTC = 08:30 AM IST (Morning Short)
    - cron: '0 3 * * *'
    # 12:00 UTC = 05:30 PM IST (Evening Short)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Daily Short Pipeline
        run: |
          python daily_scheduler.py --slot both

      - name: Commit Curriculum Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add curriculum.json tech_facts.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update CS course and Tech Facts daily shorts status [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nothing to commit"
          fi
